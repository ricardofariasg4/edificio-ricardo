services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    container_name: edificio-app
    ports:
      - "${APP_PORT:-8000}:8000"
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/var/www/html
      - ./docker/xdebug.ini:/usr/local/etc/php/conf.d/99-xdebug.ini
      - ${HOME}/.ssh:/home/appuser/.ssh:ro
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-edificio_ricardo}
      DB_USERNAME: ${DB_USERNAME:-edificio_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    command: >
      npx concurrently -c "#93c5fd,#c4b5fd,#fb7185"
      "php artisan serve --host=0.0.0.0 --port=8000"
      "XDEBUG_MODE=off php artisan queue:listen --tries=1"
      "npx vite --host 0.0.0.0 --port 5173"
      --names=server,queue,vite
      --kill-others
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - edificio

  db:
    image: mysql:8.0
    container_name: edificio-db
    ports:
      - "${DB_EXTERNAL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-edificio_ricardo}
      MYSQL_USER: ${DB_USERNAME:-edificio_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - edificio

volumes:
  db_data:

networks:
  edificio:
    driver: bridge
